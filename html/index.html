<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>IRI Signage Links</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #08111f;
			--bg-2: #0f1c31;
			--panel: rgba(12, 20, 35, 0.88);
			--panel-border: rgba(255, 255, 255, 0.12);
			--text: #eef4ff;
			--muted: #a8b3c7;
			--accent: #76b7ff;
			--accent-strong: #b7d8ff;
			--shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
		}

		body {
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background:
				radial-gradient(circle at top, rgba(118, 183, 255, 0.24), transparent 36%),
				linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
			color: var(--text);
			display: grid;
			place-items: center;
			padding: 24px;
		}

		main {
			width: min(100%, 680px);
			padding: 32px;
			border: 1px solid var(--panel-border);
			border-radius: 24px;
			background: var(--panel);
			box-shadow: var(--shadow);
			backdrop-filter: blur(12px);
		}

		head {
			margin-bottom: 24px;
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(2rem, 4vw, 3rem);
			letter-spacing: -0.04em;
		}

		p {
			margin: 0;
			color: var(--muted);
			line-height: 1.5;
		}

		ul {
			list-style: none;
			padding: 0;
			margin: 28px 0 0;
			display: grid;
			gap: 14px;
		}

		a {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			padding: 18px 20px;
			border-radius: 18px;
			text-decoration: none;
			color: var(--text);
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.08);
			transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
		}

		a:hover,
		a:focus-visible {
			transform: translateY(-2px);
			border-color: rgba(118, 183, 255, 0.45);
			background: rgba(118, 183, 255, 0.12);
			outline: none;
		}

		.link-text {
			display: grid;
			gap: 4px;
		}

		.link-title {
			font-size: 1.05rem;
			font-weight: 600;
		}

		.link-desc {
			font-size: 0.95rem;
			color: var(--muted);
		}

		.link-arrow {
			font-size: 1.2rem;
			color: var(--accent-strong);
		}

		footer {
			margin-top: 24px;
			font-size: 0.92rem;
			color: var(--muted);
		}

		@media (max-width: 560px) {
			body {
				padding: 16px;
			}

			main {
				padding: 22px;
				border-radius: 20px;
			}

			a {
				padding: 16px;
				align-items: flex-start;
				flex-direction: column;
				gap: 8px;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>IRI Signage</h1>
			<p>Select one of the existing pages below.</p>
		</header>

		<nav aria-label="Page links">
			<ul>
				<li>
					<a href="quals-queuing-stream.html">
						<span class="link-text">
							<span class="link-title">Queuing + Stream</span>
							<span class="link-desc">Main combined display page</span>
						</span>
						<span class="link-arrow">→</span>
					</a>
				</li>
				<li>
					<a href="stream/friday.html">
						<span class="link-text">
							<span class="link-title">Friday Stream</span>
							<span class="link-desc">YouTube embed for Friday</span>
						</span>
						<span class="link-arrow">→</span>
					</a>
				</li>
				<li>
					<a href="stream/saturday.html">
						<span class="link-text">
							<span class="link-title">Saturday Stream</span>
							<span class="link-desc">YouTube embed for Saturday</span>
						</span>
						<span class="link-arrow">→</span>
					</a>
				</li>
				<li>
					<a href="stream/twitch.html">
						<span class="link-text">
							<span class="link-title">Twitch Stream</span>
							<span class="link-desc">Live Twitch embed page</span>
						</span>
						<span class="link-arrow">→</span>
					</a>
				</li>
        <li>
					<a href="stream/stress-test.html">
						<span class="link-text">
							<span class="link-title">Video Stress Test</span>
							<span class="link-desc">Demo video</span>
						</span>
						<span class="link-arrow">→</span>
					</a>
				</li>
			</ul>
		</nav>
	</main>
</body>
</html>
